# ---------------------------------------------------------------------------
# OpenDonut Gradle settings
# ---------------------------------------------------------------------------
#
# This file is intentionally free of machine-specific paths. Set JAVA_HOME to a
# JDK 25 (or newer) installation before running Gradle, for example:
#
#   Windows PowerShell :  $env:JAVA_HOME = 'C:\Java\jdk25'
#   Linux / macOS      :  export JAVA_HOME=/opt/jdk-25
#
# See docs/installation.md for the full toolchain matrix.
# ---------------------------------------------------------------------------

org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m
org.gradle.parallel=true
org.gradle.caching=true

# ---------------------------------------------------------------------------
# OpenDonut version matrix
#
# Every version below was verified against upstream metadata on 2026-11-16 and
# is pinned deliberately. See docs/architecture.md ("Version matrix") for the
# evidence and for what to check before bumping.
# ---------------------------------------------------------------------------

# Project
opendonut_version=0.1.0-dev

# Toolchain: Minecraft 26.3 declares javaVersion.majorVersion=25, and Velocity
# 4.3.1 requires Java 25 as a minimum. Java 25 is therefore the common target.
java_version=25

# Minecraft / Fabric (develop.fabricmc.net and meta.fabricmc.net)
minecraft_version=26.3
fabric_loader_version=0.20.1
# Latest patch of Loom's stable 1.19 line (the bare "1.19" tag is only a Git tag; the
# published plugin markers are 1.19.1 .. 1.19.4).
fabric_loom_version=1.19.4
fabric_api_version=0.166.2+26.3

# Proxy (fill.papermc.io and repo.papermc.io)
velocity_api_version=4.3.1

# Libraries
snakeyaml_version=2.7
junit_version=6.0.3
# SQLite driver, bundled into the Velocity plugin jar (the proxy is the only
# component that opens the player-data database) and used by the common tests.
# Verified against Maven Central on 2026-11-17.
sqlite_jdbc_version=3.54.1.0
