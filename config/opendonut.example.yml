# =============================================================================
#  OpenDonut — central configuration
# =============================================================================
#
#  One file describes the whole network. The Velocity proxy and every Fabric
#  backend load the same document, which is why adding a server never requires
#  changing any Java code: edit the `servers` list, copy the file, restart.
#
#  Validate before starting anything:
#
#      java -jar opendonut-tools-<version>.jar check opendonut.yml
#      java -jar opendonut-tools-<version>.jar report opendonut.yml
#      java -jar opendonut-tools-<version>.jar route opendonut.yml -1 0
#
#  Full reference: docs/configuration.md
# =============================================================================

config-version: 1

# -----------------------------------------------------------------------------
#  The shared world
# -----------------------------------------------------------------------------
world:
  # The Minecraft level folder name. Every backend must use this exact name,
  # otherwise the "same world" assumption behind global coordinates breaks.
  # (server.properties: level-name)
  name: "world"

  # Either a number or the literal `random`.
  #
  #   random : the first component to start generates a seed and writes it to
  #            seed.properties next to this file. Every later start — and every
  #            other backend, once the file is copied there — reuses it. A new
  #            seed is never generated as long as that file exists.
  #   number : the value here wins over anything stored.
  #
  # Whichever form is used, put the resolved value into every backend's
  # server.properties as `level-seed=<value>` BEFORE its world is created:
  #
  #      java -jar opendonut-tools-<version>.jar seed opendonut.yml
  seed: random

  border:
    center-x: 0
    center-z: 0
    # Total edge length of the square border, in blocks.
    #
    # Must be a positive multiple of 16, and the centre must be a multiple of 16,
    # so that the border edges fall on chunk boundaries. A border that is not
    # chunk aligned forces every region inside it to be misaligned too, which
    # means two servers would generate the same chunk.
    size: 200000

# -----------------------------------------------------------------------------
#  Validation
# -----------------------------------------------------------------------------
validation:
  # false : part of the border may be owned by no server. A warning is printed
  #         with the exact unassigned rectangles, and players who walk into one
  #         are handled by transfer.unassigned-area-policy.
  # true  : every block inside the border must be owned; gaps are fatal.
  #
  # OpenDonut never refuses to start merely because a network is still being
  # built out, so the default is false.
  require-full-coverage: false

  # Regions and the border must line up with 16-block chunks. Leave this true:
  # turning it off only downgrades the finding to a warning, and a misaligned
  # boundary means two servers write the same chunk.
  strict-chunk-alignment: true

  # What to do about unrecognised keys: ignore | warn | error
  # `warn` is the default because a typo such as max_x for max-x otherwise
  # silently produces a region that is not the one you meant.
  unknown-fields: warn

# -----------------------------------------------------------------------------
#  Bridge (backend <-> proxy channel)
# -----------------------------------------------------------------------------
bridge:
  enabled: true
  # Plugin message channel. Change it only if it collides with another plugin.
  channel: "opendonut:bridge"

  # The shared secret that authenticates every bridge message. Resolved relative
  # to this file's directory when not absolute.
  #
  # Player clients can send plugin messages on any channel, so without a secret a
  # modified client could forge a transfer request. The secret is generated on
  # first run, must be identical on the proxy and on every backend, and must
  # never be committed to version control or pasted into chat.
  #
  #      java -jar opendonut-tools-<version>.jar secret secrets/bridge-secret.txt
  secret-file: "secrets/bridge-secret.txt"

  # How far a message timestamp may differ from the local clock. Entries outside
  # this window are rejected, and the same window bounds the replay cache.
  timestamp-tolerance-seconds: 30

# -----------------------------------------------------------------------------
#  Proxy behaviour (ignored by the backends)
# -----------------------------------------------------------------------------
proxy:
  # Register the servers below with the proxy at startup, so velocity.toml does
  # not have to list them. Names must not collide with servers already present
  # in velocity.toml.
  auto-register-backends: true

  # Verify every backend against this file before placing players on it.
  #
  # A backend can only announce itself through a player's connection, so a
  # backend that has never had a player cannot have announced itself yet. Those
  # two facts would deadlock the very first transfer, so an unknown backend is
  # admitted *provisionally*: the player is moved, which makes the backend
  # announce itself, and the arrival coordinates are only applied once the
  # backend verifies. If it does not verify, the player is sent back to the
  # server they came from.
  #
  # A backend that has announced itself and does NOT match is refused outright:
  # a player is never moved onto it.
  #
  # Set to false only if you accept players being placed on a backend whose
  # world, seed or region does not match this file.
  require-backend-hello: true

  # How long the proxy may hold an arriving player on a backend that has not
  # verified itself yet, in seconds. Keep it shorter than
  # transfer.max-pending-seconds below, otherwise a backend gives up on the
  # transfer before the proxy has finished deciding.
  arrival-verification-timeout-seconds: 5

  # What to do with a player who is routed into a coordinate that no server owns.
  # false (default): leave them where they are. true: disconnect with a message,
  # which is the choice for a network that must never have a reachable gap.
  disconnect-unrouted-players: false

  # Send a player straight to the backend they last played on at login, instead
  # of the default initial server (which would load chunks around their logout
  # position on a server they are immediately moved away from). The memory is
  # in-process only: after a proxy restart the first login of each player falls
  # back to the default behaviour.
  remember-last-server: true

# -----------------------------------------------------------------------------
#  Backend transfer behaviour (ignored by the proxy)
# -----------------------------------------------------------------------------
transfer:
  # How far into the new region a player must walk before a transfer is
  # requested. Absorbs client/server position jitter on a boundary; 1-4 is sane.
  boundary-margin-blocks: 2

  # How long after joining a backend ignores boundary checks, in ticks (20 = 1s).
  # The proxy is still placing the player, so their position is not meaningful
  # yet. 40 ticks is two seconds.
  join-grace-ticks: 40

  # Minimum time between two transfer attempts for the same player.
  cooldown-seconds: 5

  # How long a transfer request may stay unanswered before the backend treats it
  # as failed and applies on-transfer-failure.
  max-pending-seconds: 15

  # What happens when a transfer did not complete:
  #   revert   : move the player back inside their own region (default, safest —
  #              it prevents the destination server's chunks from being written
  #              by the wrong server)
  #   log-only : leave them where they are and retry after the cooldown
  on-transfer-failure: revert

  # What happens when a player stands in a coordinate that no server owns:
  #   allow  : leave them there and log it (default)
  #   return : push them back inside the owning region of this server
  unassigned-area-policy: allow

# -----------------------------------------------------------------------------
#  The visible boundary (backends only)
# -----------------------------------------------------------------------------
#
# A wall of particles on the boundary a player is walking towards, so the edge
# of their region is something they can see coming rather than something they
# discover by being teleported.
#
# It is the intersection of a sphere around each player with the boundary plane,
# so it is one block thick, it appears only when a player is within `radius`
# blocks of an edge, and it grows as they get closer. A player in the middle of
# their region sees nothing at all.
#
# The particles stand in the centre of every block of that intersection:
#
#     border-particles:
#       radius: 9                 ..o..            a few, 9 blocks out
#                                 .ooo.
#                                .ooooo.
#                                 .ooo.
#                                  .o.
#
#     the same wall, standing on the boundary:
#
#                              ooooooooooo
#                              ooooooooooo
#                              ooooooooooo
#
border-particles:
  # true by default: it is the only part of OpenDonut a player notices without
  # being told, and it makes a boundary feel intentional.
  enabled: true

  # Any Minecraft particle that needs no extra data. 'end_rod' is bright, still
  # and unmistakable; 'minecraft:end_rod' works too. A particle with parameters,
  # such as a dust colour, cannot be named here and falls back to end_rod with a
  # warning in the log.
  particle: end_rod

  # The radius of the sphere around each player, 1-32 blocks. 9 shows the wall
  # just before a player reaches it without filling their view.
  radius: 9

  # How often the wall is redrawn, in ticks (20 ticks = 1 second). Particles are
  # short-lived, so redrawing is what keeps the wall present. 4 is five times a
  # second; 1 redraws every tick and costs five times as much traffic.
  interval-ticks: 4

  # The most particles sent for any one side of the region, nearest first. A
  # radius of 9 needs about 254 per side, so the default leaves room to spare and
  # still bounds what one player can cost.
  max-per-side: 256

# -----------------------------------------------------------------------------
#  Player data synchronisation (off by default; the proxy owns the store)
# -----------------------------------------------------------------------------
#
# When a player crosses a boundary, their inventory, armour, off-hand, ender
# chest, health, hunger, experience, selected slot, effects, fire and air are
# saved by the server they leave and applied by the server they arrive on, so
# the transfer feels like walking within one world. The proxy keeps one
# versioned snapshot per player in a small SQLite database and only lets the
# server that currently owns the player write it.
#
# This section is OFF by default: a network that upgrades keeps behaving exactly
# as before until it is turned on. The proxy and every backend must have the
# same section, and the bridge must be enabled (it is by default).
#
# player-data:
#   # Master switch. false = transfers behave as they always have.
#   enabled: false
#
#   # Where the proxy stores the snapshots. Only 'sqlite' exists in this version.
#   storage: sqlite
#
#   # The database file. Relative paths are resolved against the proxy's plugin
#   # data directory. Must be a plain file name, not a path.
#   file: playerdata.db
#
#   # Periodic save while a player is online, in seconds. 0 = save only on
#   # transfer and disconnect. Bounds what a crash can lose.
#   sync-interval-seconds: 60
#
#   # How long the server a player is on may write their data, in seconds. If
#   # that server crashes, another may take over after this expires.
#   lease-seconds: 60
#
#   # What happens when the server a player is leaving cannot save their data
#   # in time: refuse-transfer (default) leaves the player where they are;
#   # proceed-with-last-known moves them with the last stored snapshot.
#   on-flush-failure: refuse-transfer
#
#   # How much of the player travels. Only 'session' is implemented: inventory,
#   # ender chest, health, hunger, XP, effects, equipment, held slot. 'progress'
#   # and 'everything' are planned and rejected with an error if set.
#   scope: session
#
#   # How many previous snapshots per player to keep in the database, for
#   # recovery after a bad transfer. 0 keeps none.
#   keep-history: 20
#
#   # The largest snapshot, after compression, that fits one bridge frame, in
#   # bytes. A snapshot bigger than this refuses the transfer with an
#   # explanation rather than being truncated. 48 KiB is the default.
#   max-payload-bytes: 49152
#
#   # How long the proxy waits for the leaving server to save the player before
#   # refusing the transfer, in seconds. Must stay below transfer.max-pending-seconds.
#   flush-timeout-seconds: 10
#
#   # Also synchronise advancement progress. Advancements live in the per-player
#   # file world/players/advancements/<uuid>.json, not in the player data, so they
#   # travel as a separate payload in their own table, under the same lease and
#   # compare-and-set rule. true by default; does nothing while enabled is false.
#   sync-advancements: true

# -----------------------------------------------------------------------------
#  World time synchronisation (optional, OFF by default)
# -----------------------------------------------------------------------------
# Each backend runs its own world clock, so /time set on one server, or a
# server that was down while the others played, leaves the clocks different
# and the sun in a different place on each side of a boundary. With this
# section on, one backend is the time authority; it reports its clock to the
# proxy, and the proxy pushes the current time to every other backend when it
# announces itself, when a player arrives on it, and periodically. Run /time
# on the authority if you want the whole network to change.
#
# This section is OFF by default. The proxy and every backend must have the
# same section, and the bridge must be enabled (it is by default).
#
# time:
#   # Master switch. false = every backend keeps its own clock.
#   enabled: false
#
#   # Which backend is the authority: 'auto' (the first backend the proxy
#   # verifies) or a server id, e.g. west.
#   authority: auto
#
#   # Which world clock to synchronise, by registry id. Vanilla provides
#   # minecraft:overworld (also the nether's clock) and minecraft:the_end.
#   clock: minecraft:overworld
#
#   # How often a backend reports its clock to the proxy, in seconds. Must be
#   # at least 1. A backend with no players online cannot report; the proxy
#   # advances the last reading by wall clock in the meantime.
#   report-interval-seconds: 5
#
#   # How often the proxy pushes the current time to every non-authority
#   # backend, in seconds. 0 = only on backend registration and player arrival.
#   sync-interval-seconds: 30
#
#   # A correction that moves a backend's clock by more than this many ticks is
#   # logged at warning level. 0 logs every correction.
#   log-divergence-ticks: 20

# -----------------------------------------------------------------------------
#  Hard region containment (backends only; ON by default)
# -----------------------------------------------------------------------------
#
# A backend never lets the outside of its own rectangle become real: no mobs
# spawn or load past the border, no blocks can be broken, used or placed
# there, dropped items are rubber-banded back inside, and a player can never
# be more than max-overshoot-blocks past the border even under lag. Players
# near the border also get a shrunk chunk radius, so their client does not
# load the neighbouring server's world.
#
# This is a safety invariant of the region model, so it is on by default and
# runs even when transfers are disabled. Set enabled: false only while
# debugging; the startup report says so loudly when it is off.
#
# containment:
#   enabled: true
#
#   # How far past its own border a player may ever be, in blocks. Must be at
#   # least transfer.boundary-margin-blocks, otherwise the clamp would pin a
#   # player at the border before the boundary transfer could ever fire (the
#   # validator reports CONTAINMENT_OVERSHOOT_BELOW_MARGIN in that case).
#   max-overshoot-blocks: 2
#
#   # How close to the border a player must be before their chunk-cache radius
#   # is shrunk, in blocks.
#   border-proximity-blocks: 48
#
#   # The chunk-cache radius sent to a near-border player (1-32 chunks).
#   near-border-chunk-radius: 3
#
#   # How often the shell just outside the region is swept for entities, in
#   # ticks. 0 disables the sweep; spawn/load prevention still applies.
#   entity-sweep-interval-ticks: 20
#
#   # How far outside the region the sweep reaches, in blocks.
#   entity-sweep-shell-blocks: 64

# -----------------------------------------------------------------------------
#  Cross-server chat (OFF by default; needs the bridge)
# -----------------------------------------------------------------------------
#
# A chat message sent on one backend is relayed through the proxy to every
# other backend, where it is shown as an unsigned '<name> message' line.
# Signatures are never forwarded, and a relayed line is never relayed again.
#
# chat:
#   enabled: false

# -----------------------------------------------------------------------------
#  This instance (backends only; the proxy ignores it)
# -----------------------------------------------------------------------------
# A backend usually works out which entry below is its own by comparing its
# listening port with the configured addresses, which means nothing has to be
# edited per machine. Set server-id explicitly only when that cannot work, for
# example two backends behind one port in a container runtime.
#
# backend:
#   server-id: west
#   enabled: true

# -----------------------------------------------------------------------------
#  Servers — the routing table
# -----------------------------------------------------------------------------
#
# Bounds are MINIMUM-INCLUSIVE, MAXIMUM-EXCLUSIVE:
#
#     min-x <= x < max-x        min-z <= z < max-z
#
# Both examples below put the shared edge at x = 0: block -1 belongs to `west`,
# block 0 belongs to `east`. They tile the border exactly, so no coordinate is
# owned twice and none is left over.
#
# Coordinates are global block coordinates. Every backend sees the same number
# for the same physical place, which is what makes a shared coordinate system
# possible at all: a player who walks from x = -1 to x = 0 arrives on `east` at
# x = 0, standing on terrain that `east` generated from the same seed.
#
servers:
  - id: west
    address: "127.0.0.1:25566"
    bounds:
      min-x: -100000
      max-x: 0
      min-z: -100000
      max-z: 100000

  - id: east
    address: "127.0.0.1:25567"
    bounds:
      min-x: 0
      max-x: 100000
      min-z: -100000
      max-z: 100000
